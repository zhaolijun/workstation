<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>灵感速记 · 大土工作台</title>
  <link rel="stylesheet" href="/datu/assets/app.css">
</head>
<body>
  <div id="app">
    <app-shell :active="'ideas'" :user="user" :categories="navCategories" v-if="loaded">
      <template #title>灵感速记</template>
      <template #content>
        <div class="grid two">
          <div class="card">
            <h2>随手记录</h2>
            <div class="form-grid">
              <div class="field"><label>标题</label><input v-model.trim="form.title" placeholder="给想法一个名字（可选）"></div>
              <div class="field"><label>标签</label><input v-model.trim="form.tags" placeholder="用逗号分隔：自动化, 监控"></div>
              <div class="field full"><label>想法内容</label><textarea v-model="form.content" placeholder="记下你的想法…"></textarea></div>
            </div>
            <div class="form-actions"><button class="btn primary" @click="createIdea">保存灵感</button></div>
          </div>

          <div class="card">
            <h2>按标签找</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button v-for="tag in allTags" :key="tag" class="tag" :class="{ blue: selectedTag === tag }" @click="selectedTag = selectedTag === tag ? '' : tag">#{{ tag }}</button>
              <button v-if="selectedTag" class="tag red" @click="selectedTag = ''">清除筛选</button>
            </div>
            <div v-if="!allTags.length" class="empty">还没有标签</div>
          </div>

          <div class="card" style="grid-column:1/-1">
            <div class="section-head"><h2>灵感清单</h2><span>{{ visibleIdeas.length }} 条</span></div>
            <div class="list">
              <article v-for="idea in visibleIdeas" :key="idea.id" class="item">
                <div class="item-top">
                  <div>
                    <div class="item-title">{{ idea.title || '未命名灵感' }}</div>
                    <p style="margin:8px 0 0;white-space:pre-wrap">{{ idea.content }}</p>
                    <div class="meta">
                      <span v-for="tag in ideaTags(idea)" :key="tag" class="tag" @click="selectedTag = tag">#{{ tag }}</span>
                    </div>
                  </div>
                  <button class="btn small danger" @click="removeIdea(idea)">删除</button>
                </div>
              </article>
            </div>
            <div v-if="!visibleIdeas.length" class="empty">暂无灵感</div>
          </div>
        </div>
      </template>
    </app-shell>
  </div>
  <script src="/datu/vendor/vue.global.prod.js"></script>
  <script src="/datu/assets/app.js"></script>
  <script>
    Datu.mountPage({
      active: "ideas",
      setup() {
        const state = Vue.reactive({ ideas: [], selectedTag: "", form: { title: "", content: "", tags: "" } });

        const allTags = Vue.computed(() => [...new Set(state.ideas.flatMap(idea => ideaTags(idea)))].sort());
        const visibleIdeas = Vue.computed(() => state.selectedTag ? state.ideas.filter(idea => ideaTags(idea).includes(state.selectedTag)) : state.ideas);

        function ideaTags(idea) { return (idea.tags || "").split(/[,，;；\s]+/).filter(Boolean); }
        async function load() { const workspace = await Datu.request("/datu/api/workspace"); state.ideas = workspace.ideas || []; }
        async function refresh() { await load(); Datu.showToast("已保存"); }
        async function createIdea() {
          if (!state.form.content) return;
          await Datu.request("/datu/api/ideas", "POST", state.form);
          state.form = { title: "", content: "", tags: "" };
          await refresh();
        }
        async function removeIdea(idea) { if (!confirm("确认删除？")) return; await Datu.request(`/datu/api/ideas/${idea.id}`, "DELETE"); await refresh(); }

        Vue.onMounted(load);
        return { ...Vue.toRefs(state), allTags, visibleIdeas, ideaTags, createIdea, removeIdea };
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>每周复盘 · 大土工作台</title>
  <link rel="stylesheet" href="/datu/assets/app.css">
</head>
<body>
  <div id="app">
    <app-shell :active="'review'" :user="user" :categories="navCategories" v-if="loaded">
      <template #title>每周复盘</template>
      <template #content>
        <div class="grid full">
          <div class="card">
            <div class="section-head"><h2>本周概览</h2><span>{{ weekStart }} ~ {{ weekEnd }}</span></div>
            <div class="stat-grid">
              <div class="stat"><b>{{ doneTasks.length }}</b><span>完成事项</span></div>
              <div class="stat"><b>{{ urgentImportantCount }}</b><span>紧急重要</span></div>
              <div class="stat"><b>{{ blockedTasks.length }}</b><span>当前卡住</span></div>
              <div class="stat"><b>{{ stuckCategories.length }}</b><span>卡住分类</span></div>
            </div>
          </div>
          <div class="grid two">
            <div class="card">
              <h2>按优先级分布</h2>
              <div v-if="doneTasks.length">
                <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
                  <svg width="120" height="120" viewBox="0 0 120 120">
                    <circle v-for="(item, index) in prioritySegments" :key="index" r="47" cx="60" cy="60" fill="transparent"
                            :stroke="item.color" stroke-width="18" :stroke-dasharray="item.dash" :stroke-dashoffset="item.offset"
                            transform="rotate(-90 60 60)"></circle>
                    <text x="60" y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#172b31">{{ doneTasks.length }}</text>
                    <text x="60" y="76" text-anchor="middle" font-size="11" fill="#64777d">总计</text>
                  </svg>
                  <div class="chart">
                    <div v-for="item in prioritySegments" :key="item.label" class="bar-row">
                      <span>{{ item.label }}</span>
                      <div class="bar"><i :style="{ width: item.percent + '%', background: item.color }"></i></div>
                      <b>{{ item.value }}</b>
                    </div>
                  </div>
                </div>
              </div>
              <div v-else class="empty">本周暂无完成记录</div>
            </div>

            <div class="card">
              <h2>精力花在哪些项目</h2>
              <div v-if="doneTasks.length" class="chart">
                <div v-for="item in categorySegments" :key="item.label" class="bar-row">
                  <span>{{ item.label }}</span>
                  <div class="bar"><i :style="{ width: item.percent + '%' }"></i></div>
                  <b>{{ item.value }}</b>
                </div>
              </div>
              <div v-else class="empty">完成事项后这里会更新</div>
            </div>

            <div class="card" style="grid-column:1/-1">
              <h2>卡点汇总</h2>
              <div class="list">
                <div v-for="item in blockers" :key="item.text" class="item">
                  <b>{{ item.source }}</b>
                  <p style="margin:8px 0 0;white-space:pre-wrap">{{ item.text }}</p>
                </div>
              </div>
              <div v-if="!blockers.length" class="empty">本周暂无明显卡点</div>
            </div>
          </div>
        </div>
      </template>
    </app-shell>
  </div>
  <script src="/datu/vendor/vue.global.prod.js"></script>
  <script src="/datu/assets/app.js"></script>
  <script>
    Datu.mountPage({
      active: "review",
      setup() {
        const state = Vue.reactive({ tasks: [], categories: [] });
        const weekStart = Datu.monday();
        const weekEnd = (() => { const date = new Date(`${weekStart}T00:00:00`); date.setDate(date.getDate() + 6); return date.toISOString().slice(0, 10); })();

        const doneTasks = Vue.computed(() => state.tasks.filter(task => {
          if (!task.completed_at) return false;
          const completed = task.completed_at.slice(0, 10);
          return completed >= weekStart && completed <= weekEnd;
        }));

        const prioritySegments = Vue.computed(() => {
          const colors = ["#d43f4c", "#147c9e", "#c77618", "#64777d"];
          const items = Object.entries(Datu.priorityText).map(([key, label], index) => ({
            label,
            value: doneTasks.value.filter(task => task.priority === key).length,
            color: colors[index % colors.length]
          })).filter(item => item.value > 0);
          const total = items.reduce((sum, item) => sum + item.value, 0) || 1;
          let offset = 0;
          return items.map(item => {
            const circumference = 2 * Math.PI * 47;
            const length = item.value / total * circumference;
            const result = { ...item, percent: Math.round(item.value * 100 / total), dash: `${length} ${circumference - length}`, offset: -offset };
            offset += length;
            return result;
          });
        });

        const categorySegments = Vue.computed(() => {
          const items = state.categories.map(category => ({
            label: category.name,
            value: doneTasks.value.filter(task => task.category_id === category.id).length
          }));
          items.push({ label: "未分类", value: doneTasks.value.filter(task => !task.category_id).length });
          const total = items.reduce((sum, item) => sum + item.value, 0) || 1;
          return items.filter(item => item.value > 0).map(item => ({ ...item, percent: Math.round(item.value * 100 / total) }));
        });

        const blockedTasks = Vue.computed(() => state.tasks.filter(task => !task.done && task.blocked));
        const stuckCategories = Vue.computed(() => state.categories.filter(category => category.status === "stuck"));
        const urgentImportantCount = Vue.computed(() => doneTasks.value.filter(task => task.priority === "urgent_important").length);
        const blockers = Vue.computed(() => [
          ...blockedTasks.value.map(task => ({ source: "待办任务", text: task.title })),
          ...stuckCategories.value.map(category => ({ source: "工作分类", text: category.name }))
        ]);

        Vue.onMounted(async () => {
          const workspace = await Datu.request("/datu/api/workspace");
          state.tasks = workspace.tasks || [];
          state.categories = workspace.categories || [];
        });

        return { ...Vue.toRefs(state), weekStart, weekEnd, doneTasks, prioritySegments, categorySegments, blockedTasks, stuckCategories, urgentImportantCount, blockers };
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大土工作台</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#172b31;--muted:#64777d;--line:#dce6e8;--teal:#0e8f80;--teal-dark:#086d65;--blue:#147c9e;--red:#d43f4c;--amber:#c77618;--green:#23855f;--shadow:0 10px 28px rgba(21,65,70,.09);--radius:16px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;min-height:45px;width:100%;outline:none}textarea{resize:vertical;min-height:90px}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,143,128,.14)}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e9f5f3 0%,#f4f7f8 50%,#eaf3f7 100%)}.login-card{width:min(420px,100%);background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:34px}.login-card h1{margin:16px 0 6px;font-size:28px}.brand{width:57px;height:57px;border-radius:17px;background:linear-gradient(145deg,var(--teal),var(--blue));display:grid;place-items:center;color:#fff;font-weight:800}
.app-shell{min-height:100vh;display:grid;grid-template-columns:242px 1fr;grid-template-rows:auto 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;grid-row:1/3}.side-logo{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}.side-logo strong{font-size:19px;display:block}.side-logo small{color:var(--muted)}
.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:12px 14px;border-radius:12px;background:transparent;color:#41565b;text-align:left}.nav button:hover{background:#edf5f4}.nav button.active{background:linear-gradient(90deg,#e6f5f2,#fff);color:var(--teal-dark);font-weight:700}.nav-badge{min-width:27px;height:27px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}.side-actions{margin-top:24px;display:grid;gap:9px}.side-actions button,.side-actions label{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:11px}
.main{min-width:0;padding:22px 26px 46px}
.risk-card{position:relative;overflow:hidden;color:#fff;border-radius:20px;padding:25px 27px;box-shadow:0 16px 40px rgba(8,109,101,.17);background:linear-gradient(125deg,#086d65,#0e9284 54%,#14879f)}.risk-card.clean{background:linear-gradient(125deg,#0d7f76,#158a80 48%,#26949f)}.risk-card.danger{background:linear-gradient(125deg,#a0313c,#c2454c 52%,#bf7134)}.risk-card h3{margin:0;font-size:25px}.risk-sub{opacity:.82;margin-top:4px}.risk-pill{display:inline-flex;align-items:center;min-height:36px;padding:6px 15px;margin-top:17px;border-radius:19px;background:rgba(255,255,255,.16);font-size:13px}.risk-items{position:relative;margin-top:18px;display:grid;gap:8px}.risk-item{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 11px;font-size:13px}.risk-shape{position:absolute;right:-35px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.grid{display:grid;gap:18px;margin-top:22px}.grid.two{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}.grid.full{grid-template-columns:1fr}.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:21px;min-width:0}.card>h3,.section-title{margin:0 0 17px}.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.section-title span{color:var(--muted);font-size:13px}
.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;color:var(--muted)}
.btn{min-height:46px;padding:10px 19px;border-radius:12px;background:#ecf5f4;color:var(--teal-dark);font-weight:600;transition:.2s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--teal);color:#fff}.btn.danger{background:#fff2f3;color:var(--red)}.btn.small{min-height:35px;padding:5px 11px;font-size:13px;border-radius:9px}.form-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.task-list,.idea-list,.goal-list,.cat-list{display:grid;gap:10px}.task,.idea,.goal,.cat{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}.task.done{opacity:.58}.task-top,.idea-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.task-title,.idea-title,.goal-title,.cat-name{font-weight:650}.task-meta,.idea-meta,.goal-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:12px;color:var(--muted)}.tag{padding:4px 8px;border-radius:8px;background:#eef6f4;color:#1a6a67}.tag.red{background:#ffecee;color:var(--red)}.tag.amber{background:#fff3e3;color:#a46110}.tag.blue{background:#e8f4f9;color:#146d90}.task-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.check{width:25px;height:25px;accent-color:var(--teal);border-radius:7px;flex:none}
.progress{height:9px;border-radius:6px;background:#edf3f2;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue))}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:14px;border-radius:13px;background:#f4f8f7}.stat b{font-size:23px;display:block}.stat span{color:var(--muted);font-size:12px}.chart{display:grid;gap:10px;margin-top:15px}.bar-row{display:grid;grid-template-columns:92px 1fr 35px;gap:9px;align-items:center;font-size:13px}.bar{height:11px;background:#edf3f2;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue))}
.empty{color:var(--muted);text-align:center;padding:25px 0}.date-group{margin-top:18px}.date-group h4{margin:0 0 10px;color:#41565b}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filter{min-height:38px;padding:7px 13px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--muted)}.filter.active{background:var(--teal);border-color:var(--teal);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#172b31;color:#fff;padding:11px 19px;border-radius:11px;box-shadow:var(--shadow);max-width:min(90vw,480px)}
.mobile-top{display:none}.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(244,247,248,.92);z-index:50;font-weight:650}
@media(max-width:900px){.app-shell{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:min(82vw,290px);z-index:20;transform:translateX(-103%);transition:.24s;box-shadow:0 0 50px rgba(0,0,0,.2)}.side.open{transform:translateX(0)}.main{padding:15px 14px 38px}.mobile-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);margin:-15px -14px 15px;padding:12px 14px;border-bottom:1px solid var(--line)}.menu-btn{width:47px;height:47px;border-radius:13px;background:#edf5f4;display:grid;place-items:center;font-size:19px}.grid.two,.form-grid,.stat-grid{grid-template-columns:1fr}.risk-card{padding:21px}.risk-card h3{font-size:21px}.card{padding:15px}.side-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:15}}
</style>
</head>
<body>
<div id="loading" class="loading">正在连接大土工作台…</div>
<div id="toast" class="toast hidden"></div>
<div id="loginView" class="login hidden"><form id="loginForm" class="login-card"><div class="brand">土</div><h1>大土工作台</h1><p style="color:var(--muted)">日常待办、灵感与团队目标统一管理</p><div class="field"><label>用户名</label><input id="username" autocomplete="username" required></div><div class="field" style="margin-top:13px"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:20px">登录工作台</button><p id="loginError" style="color:var(--red);min-height:20px;margin:12px 0 0"></p></form></div>
<div id="app" class="app-shell hidden">
<aside id="side" class="side"><div class="side-logo"><div class="brand">土</div><div><strong>大土工作台</strong><small id="userLabel"></small></div></div><nav class="nav" id="nav"></nav><div class="side-actions"><button id="exportBtn">导出备份</button><label>导入备份<input id="importFile" type="file" accept=".json" hidden></label><button id="logoutBtn">退出登录</button></div></aside>
<main class="main"><div class="mobile-top"><button id="menuBtn" class="menu-btn" aria-label="打开菜单">☰</button><b id="mobileTitle">今天待办</b><button id="clearBtn" class="btn small danger">清空示例</button></div><div id="riskCard"></div><div id="view"></div></main>
</div>
<script>
const state={user:null,view:"tasks",filter:"active",tag:"",workspace:null};
const priorityText={urgent_important:"紧急重要",important_not_urgent:"重要不紧急",urgent_not_important:"紧急不重要",normal:"常规"};
const priorityColor={urgent_important:"#d43f4c",important_not_urgent:"#147c9e",urgent_not_important:"#c77618",normal:"#64777d"};
const statusText={normal:"正常",attention:"需关注",stuck:"卡住",not_started:"未开始",in_progress:"进行中",completed:"已完成",done:"已完成",blocked:"卡住"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(v){if(!v)return"";const d=new Date(v+"T00:00:00");return `${d.getMonth()+1}月${d.getDate()}日`}
async function api(path,method="GET",body){const res=await fetch(path,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});if(res.status===401){showLogin();throw new Error("登录已过期")}const data=await res.clone().json().catch(()=>({}));if(!res.ok)throw new Error(data.error||"请求失败");return data}
function toast(msg,error=false){const t=document.getElementById("toast");t.textContent=msg;t.classList.toggle("hidden",false);t.style.background=error?"#a0313c":"#172b31";clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add("hidden"),2600)}
async function safe(fn,message){try{await fn()}catch(e){toast(e.message||message,true)}}
function showLogin(){document.getElementById("app").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden");document.getElementById("loading").classList.add("hidden")}
function showApp(){document.getElementById("loginView").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("loading").classList.add("hidden")}
function todayTasks(){return state.workspace?.tasks.filter(t=>!t.done&&t.due_date===state.workspace.today)??[]}
function blockedTasks(){return state.workspace?.tasks.filter(t=>!t.done&&t.blocked)??[]}
function stuckCategories(){return state.workspace?.categories.filter(c=>c.status==="stuck")??[]}
function riskList(){const seen=new Set(),list=[];for(const t of [...todayTasks(),...blockedTasks()]){if(seen.has(t.id))continue;seen.add(t.id);list.push({type:"task",id:t.id,text:t.title,meta:(t.postponed_count?`已顺延 ${t.postponed_count} 次`:"今日任务")+(t.blocked?" · 已标记卡住":"")})}for(const c of stuckCategories())list.push({type:"category",id:c.id,text:c.name,meta:"项目卡住"});return list}
function renderRisk(){const list=riskList(),danger=list.length>0;document.getElementById("riskCard").innerHTML=`<section class="risk-card ${danger?"danger":"clean"}"><div class="risk-shape"></div><h3>今天要处理的</h3><div class="risk-sub">${state.workspace.weekStart} ~ ${state.workspace.today}</div><div class="risk-pill">${danger?`${list.length} 项需要立即关注`:"今天很清爽，没有需要处理的"}</div>${danger?`<div class="risk-items">${list.slice(0,5).map(i=>`<div class="risk-item">● ${esc(i.text)} — ${esc(i.meta)}</div>`).join("")}</div>`:""}</section>`;document.getElementById("riskCard").classList.toggle("hidden",state.view==="review")}
function renderNav(){const defs=[["tasks","今天待办",todayTasks().length],["ideas","灵感速记",0],["team","团队建设",0],["categories","工作分类",0],["review","每周复盘",0]];document.getElementById("nav").innerHTML=defs.map(([id,label,count])=>`<button data-view="${id}" class="${state.view===id?"active":""}"><span>${label}</span>${count?`<span class="nav-badge">${count}</span>`:""}</button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;closeSide();render()});document.getElementById("mobileTitle").textContent=defs.find(d=>d[0]===state.view)[1]}
function taskRow(t){const category=state.workspace.categories.find(c=>c.id===t.category_id);return `<article class="task ${t.done?"done":""}"><div class="task-top"><label style="display:flex;gap:11px;min-width:0"><input type="checkbox" class="check" data-act="toggle" data-id="${t.id}" ${t.done?"checked":""}><div><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span class="tag" style="background:${priorityColor[t.priority]||"#64777d"}22;color:${priorityColor[t.priority]||"#64777d"}">${priorityText[t.priority]||t.priority}</span><span class="tag ${!t.done&&t.due_date<state.workspace.today?"red":""}">截止 ${fmtDate(t.due_date)}</span>${category?`<span class="tag blue">${esc(category.name)}</span>`:""}${t.blocked?`<span class="tag red">卡住</span>`:""}${t.postponed_count?`<span class="tag amber">顺延 ${t.postponed_count} 次</span>`:""}</div></div></label></div><div class="task-actions"><select data-act="priority" data-id="${t.id}" style="width:auto;min-height:37px">${Object.entries(priorityText).map(([k,v])=>`<option value="${k}" ${t.priority===k?"selected":""}>${v}</option>`).join("")}</select><select data-act="category" data-id="${t.id}" style="width:auto;min-height:37px"><option value="">无分类</option>${state.workspace.categories.map(c=>`<option value="${c.id}" ${c.id===t.category_id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><button class="btn small" data-act="postpone" data-id="${t.id}">顺延明天</button><button class="btn small" data-act="block" data-id="${t.id}">${t.blocked?"取消卡住":"标记卡住"}</button><button class="btn small danger" data-act="delete-task" data-id="${t.id}">删除</button></div></article>`}
function taskForm(){return `<div class="card"><h3>添加任务</h3><form id="taskForm"><div class="form-grid"><div class="field"><label>任务内容</label><input name="title" placeholder="要做什么？" required></div><div class="field"><label>轻重缓急</label><select name="priority">${Object.entries(priorityText).map(([k,v],i)=>`<option value="${k}" ${i===0?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>截止日期</label><input name="dueDate" type="date" value="${state.workspace.today}" required></div><div class="field"><label>所属分类</label><select name="categoryId"><option value="">（无分类）</option>${state.workspace.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>状态</label><label style="display:flex;align-items:center;gap:8px;min-height:45px"><input class="check" type="checkbox" name="blocked" style="width:22px"> 是否卡住</label></div></div><div class="form-actions"><button class="btn primary">添加任务</button></div></form></div>`}
function renderTasks(){const all=state.workspace.tasks,active=all.filter(t=>!t.done),done=all.filter(t=>t.done&&t.completed_at?.startsWith(state.workspace.today));const groups=[];if(state.filter==="active"){const map={};for(const t of active){(map[t.due_date]??=[]).push(t)}for(const date of Object.keys(map).sort())groups.push([date,map[date]])}else if(state.filter==="today")groups.push([state.workspace.today,active.filter(t=>t.due_date<=state.workspace.today)]);else if(state.filter==="future")groups.push(["未来",active.filter(t=>t.due_date>state.workspace.today)]);else groups.push(["今天已完成",done]);const label={active:"全部未完成",today:"今天及逾期",future:"未来任务",done:"今天完成"}[state.filter];return `${taskForm()}<div class="card"><div class="section-title">任务列表<span>${label} ${active.length+done.length} 项</span></div><div class="filters">${["active","today","future","done"].map(f=>`<button class="filter ${state.filter===f?"active":""}" data-filter="${f}">${{active:"全部",today:"今天",future:"未来",done:"完成"}[f]}</button>`).join("")}</div>${groups.length?groups.map(([date,tasks])=>`<div class="date-group"><h4>${date==="未来"?"未来任务":fmtDate(date)} · ${tasks.length}</h4><div class="task-list">${tasks.map(taskRow).join("")}</div></div>`).join(""):'<div class="empty">暂无任务</div>'}</div>`}
function ideaCard(i){return `<article class="idea"><div class="idea-top"><div><div class="idea-title">${esc(i.title||"未命名灵感")}</div><p style="margin:8px 0 0;white-space:pre-wrap">${esc(i.content)}</p><div class="idea-meta">${i.tags.split(/[,，;；\s]+/).filter(Boolean).map(tag=>`<button class="tag" data-tag="${esc(tag)}">#${esc(tag)}</button>`).join("")||'<span>未打标签</span>'}</div></div><button class="btn small danger" data-act="delete-idea" data-id="${i.id}">删除</button></div></article>`}
function renderIdeas(){let ideas=state.workspace.ideas;if(state.tag)ideas=ideas.filter(i=>i.tags.includes(state.tag));const tags=[...new Set(state.workspace.ideas.flatMap(i=>i.tags.split(/[,，;；\s]+/).filter(Boolean)))].sort();return `<div class="grid two"><div class="card"><h3>随手记录</h3><form id="ideaForm"><div class="form-grid"><div class="field"><label>标题</label><input name="title" placeholder="给想法一个名字（可选）"></div><div class="field"><label>标签</label><input name="tags" placeholder="用逗号分隔：自动化, 监控"></div><div class="field"><label>想法内容</label><textarea name="content" placeholder="记下你的想法…"></textarea></div></div><div class="form-actions"><button class="btn primary">保存灵感</button></div></form></div><div class="card"><h3>按标签找</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${tags.length?tags.map(tag=>`<button class="tag ${state.tag===tag?"blue":""}" data-tag="${esc(tag)}">#${esc(tag)}</button>`).join(""):'<span class="empty">还没有标签</span>'}${state.tag?'<button class="tag red" data-tag="">清除筛选</button>':""}</div></div><div class="card" style="grid-column:1/-1"><div class="section-title">灵感清单<span>${ideas.length} 条</span></div><div class="idea-list">${ideas.length?ideas.map(ideaCard).join(""):'<div class="empty">暂无灵感</div>'}</div></div></div>`}
function renderTeam(){const goals=state.workspace.teamGoals,progress=state.workspace.teamProgress;return `<div class="grid two"><div class="card"><h3>新增目标</h3><form id="goalForm"><div class="form-grid"><div class="field"><label>周期</label><select name="period"><option value="monthly">月度</option><option value="quarterly">季度</option></select></div><div class="field"><label>目标名称</label><input name="title" placeholder="例如：9 月降噪提升"></div><div class="field"><label>目标日期</label><input name="dueDate" type="date"></div><div class="field"><label>目标内容</label><textarea name="objectives" placeholder="一行一个目标"></textarea></div><div class="field"><label>行动计划</label><textarea name="plan" placeholder="按周或阶段写计划"></textarea></div></div><div class="form-actions"><button class="btn primary">保存目标</button></div></form></div><div class="card"><h3>记录本周完成情况</h3><form id="progressForm"><div class="form-grid"><div class="field"><label>目标</label><select name="goalId" required>${goals.map(g=>`<option value="${g.id}">${esc(g.title)}</option>`).join("")}</select></div><div class="field"><label>周开始</label><input name="weekStart" type="date" value="${state.workspace.weekStart}"></div><div class="field"><label>状态</label><select name="status"><option value="in_progress">进行中</option><option value="completed">已完成</option><option value="blocked">卡住</option></select></div><div class="field"><label>本周结果</label><textarea name="result" placeholder="完成了什么？"></textarea></div><div class="field"><label>卡点</label><textarea name="blockers" placeholder="需要谁支持？"></textarea></div></div><div class="form-actions"><button class="btn primary">保存记录</button></div></form></div><div class="card" style="grid-column:1/-1"><div class="section-title">月度 / 季度目标<span>${goals.length} 个</span></div><div class="goal-list">${goals.length?goals.map(g=>{const rows=progress.filter(p=>p.goal_id===g.id);return `<article class="goal"><div class="idea-top"><div><div class="goal-title">${esc(g.title)}</div><div class="goal-meta"><span class="tag blue">${g.period==="quarterly"?"季度":"月度"}</span><span class="tag">${statusText[g.status]||g.status}</span>${g.due_date?`<span>目标日期 ${fmtDate(g.due_date)}</span>`:""}</div><details style="margin-top:11px"><summary>目标与计划</summary><p style="white-space:pre-wrap">${esc(g.objectives||"未填写")}</p><p style="white-space:pre-wrap">${esc(g.plan||"未填写")}</p></details><details style="margin-top:8px"><summary>周记录 ${rows.length}</summary>${rows.length?rows.map(r=>`<div class="task" style="margin-top:8px"><b>${fmtDate(r.week_start)} 周</b><div class="goal-meta"><span class="tag">${statusText[r.status]||r.status}</span></div><p style="margin:8px 0;white-space:pre-wrap">${esc(r.result||"未填写")}</p><p style="margin:0;color:var(--red);white-space:pre-wrap">${esc(r.blockers||"")}</p></div>`).join(""):'<p style="color:var(--muted)">暂无记录</p>'}</details></div><button class="btn small danger" data-act="delete-goal" data-id="${g.id}">删除</button></div></article>`}).join(""):'<div class="empty">暂无团队目标</div>'}</div></div></div>`}
function renderCategories(){const cats=state.workspace.categories;return `<div class="grid two"><div class="card"><h3>新增工作分类</h3><form id="categoryForm"><div class="form-grid"><div class="field"><label>分类名</label><input name="name" placeholder="例如：系统巡检" required></div><div class="field"><label>状态</label><select name="status"><option value="normal">正常</option><option value="attention">需关注</option><option value="stuck">卡住</option></select></div><div class="field"><label>内容说明</label><textarea name="description" placeholder="这个分类负责什么？"></textarea></div></div><div class="form-actions"><button class="btn primary">保存分类</button></div></form></div><div class="card" style="grid-column:1/-1"><div class="section-title">分类进度<span>${cats.length} 个</span></div><div class="cat-list">${cats.length?cats.map(c=>{const pct=c.total_count?Math.round(c.done_count*100/c.total_count):0;const tasks=state.workspace.tasks.filter(t=>t.category_id===c.id&&!t.done);return `<article class="cat"><div class="idea-top"><div><div class="cat-name">${esc(c.name)}</div><div class="goal-meta"><span class="tag ${c.status==="stuck"?"red":c.status==="attention"?"amber":"blue"}">${statusText[c.status]||c.status}</span><span>${c.done_count}/${c.total_count} 完成</span></div><div class="progress" style="margin-top:11px"><i style="width:${pct}%"></i></div><p style="margin:11px 0 0;color:var(--muted);white-space:pre-wrap">${esc(c.description||"未填写说明")}</p>${tasks.length?`<div class="task-meta">${tasks.slice(0,4).map(t=>`<span class="tag">${esc(t.title)}</span>`).join("")}</div>`:""}</div><button class="btn small danger" data-act="delete-category" data-id="${c.id}">删除</button></div><div style="margin-top:12px"><select data-act="category-status" data-id="${c.id}"><option value="normal" ${c.status==="normal"?"selected":""}>正常</option><option value="attention" ${c.status==="attention"?"selected":""}>需关注</option><option value="stuck" ${c.status==="stuck"?"selected":""}>卡住</option></select></div></article>`}).join(""):'<div class="empty">暂无分类</div>'}</div></div></div>`}
function donutChart(items){const total=items.reduce((s,i)=>s+i.value,0)||1,colors=["#0e8f80","#147c9e","#c77618","#d43f4c","#64777d"];let offset=0;const radius=47,circumference=2*Math.PI*radius;const segments=items.map((item,index)=>{const len=item.value/total*circumference,dash=`${len} ${circumference-len}`;const el=`<circle r="${radius}" cx="60" cy="60" fill="transparent" stroke="${colors[index%colors.length]}" stroke-width="18" stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 60 60)"/>`;offset+=len;return el}).join("");return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg width="120" height="120" viewBox="0 0 120 120">${segments}<text x="60" y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#172b31">${total}</text><text x="60" y="76" text-anchor="middle" font-size="11" fill="#64777d">总计</text></svg><div class="chart">${items.map((item,index)=>`<div class="bar-row"><span>${esc(item.label)}</span><div class="bar"><i style="width:${Math.round(item.value*100/total)}%;background:${colors[index%colors.length]}"></i></div><b>${item.value}</b></div>`).join("")}</div></div>`}
function renderReview(){const weekStart=new Date(state.workspace.weekStart+"T00:00:00"),weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);const inWeek=t=>t.completed_at&&new Date(t.completed_at)>weekStart&&new Date(t.completed_at)<new Date(weekEnd.getTime()+864e5);const done=state.workspace.tasks.filter(inWeek);const priorityItems=Object.entries(priorityText).map(([key,label])=>({label,value:done.filter(t=>t.priority===key).length}));const categoryItems=state.workspace.categories.map(c=>({label:c.name,value:state.workspace.tasks.filter(t=>t.category_id===c.id&&inWeek(t)).length}));categoryItems.push({label:"未分类",value:done.filter(t=>!t.category_id).length});const blockers=state.workspace.teamProgress.filter(p=>p.week_start===state.workspace.weekStart&&p.blockers).map(p=>({goal:state.workspace.teamGoals.find(g=>g.id===p.goal_id)?.title||"团队目标",text:p.blockers}));state.workspace.tasks.filter(t=>!t.done&&t.blocked).forEach(t=>blockers.push({goal:"待办任务",text:t.title}));return `<div class="grid full"><div class="card"><div class="section-title">本周概览<span>${state.workspace.weekStart} ~ ${weekEnd.toISOString().slice(0,10)}</span></div><div class="stat-grid"><div class="stat"><b>${done.length}</b><span>完成事项</span></div><div class="stat"><b>${done.filter(t=>t.priority==="urgent_important").length}</b><span>紧急重要</span></div><div class="stat"><b>${blockedTasks().length}</b><span>当前卡住</span></div><div class="stat"><b>${stuckCategories().length}</b><span>卡住项目</span></div></div></div><div class="grid two"><div class="card"><h3>按优先级分布</h3>${done.length?donutChart(priorityItems):'<div class="empty">本周暂无完成记录</div>'}</div><div class="card"><h3>精力花在哪些项目</h3>${done.length?donutChart(categoryItems):'<div class="empty">完成事项后这里会更新</div>'}</div><div class="card" style="grid-column:1/-1"><h3>卡点汇总</h3>${blockers.length?blockers.map(b=>`<div class="task"><b>${esc(b.goal)}</b><p style="margin:8px 0 0;white-space:pre-wrap">${esc(b.text)}</p></div>`).join(""):'<div class="empty">本周暂无明显卡点</div>'}</div></div></div>`}
function render(){if(!state.workspace)return;renderNav();renderRisk();document.getElementById("view").innerHTML=state.view==="tasks"?renderTasks():state.view==="ideas"?renderIdeas():state.view==="team"?renderTeam():state.view==="categories"?renderCategories():renderReview();bindEvents()}
function bindEvents(){document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{state.tag=b.dataset.tag;render()});document.querySelectorAll('[data-act="toggle"]').forEach(b=>b.onchange=async()=>await safe(()=>update("tasks",b.dataset.id,{done:b.checked}),"更新失败"));document.querySelectorAll('[data-act="priority"],[data-act="category"],[data-act="category-status"]').forEach(b=>b.onchange=async()=>{const act=b.dataset.act;await safe(()=>update(act==="priority"?"tasks":act==="category"?"tasks":"categories",b.dataset.id,{[act==="priority"?"priority":act==="category"?"categoryId":"status"]:b.value}),"更新失败")});document.querySelectorAll('[data-act="postpone"]').forEach(b=>b.onclick=async()=>{const task=state.workspace.tasks.find(t=>t.id==b.dataset.id);await safe(()=>update("tasks",b.dataset.id,{postpone:true,postponedCount:task.postponed_count}),"顺延失败")});document.querySelectorAll('[data-act="block"]').forEach(b=>b.onclick=async()=>{const task=state.workspace.tasks.find(t=>t.id==b.dataset.id);await safe(()=>update("tasks",b.dataset.id,{blocked:!task.blocked}),"更新失败")});document.querySelectorAll('[data-act="delete-task"]').forEach(b=>b.onclick=async()=>await safe(()=>remove("tasks",b.dataset.id),"删除失败"));document.querySelectorAll('[data-act="delete-idea"]').forEach(b=>b.onclick=async()=>await safe(()=>remove("ideas",b.dataset.id),"删除失败"));document.querySelectorAll('[data-act="delete-category"]').forEach(b=>b.onclick=async()=>await safe(()=>remove("categories",b.dataset.id),"删除失败"));document.querySelectorAll('[data-act="delete-goal"]').forEach(b=>b.onclick=async()=>await safe(()=>remove("team-goals",b.dataset.id),"删除失败"));const taskForm=document.getElementById("taskForm");if(taskForm)taskForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(taskForm);await safe(()=>create("tasks",{title:f.get("title"),priority:f.get("priority"),dueDate:f.get("dueDate"),categoryId:f.get("categoryId"),blocked:f.get("blocked")==="on"}),"创建失败");taskForm.reset();taskForm.querySelector('[name="dueDate"]').value=state.workspace.today};const ideaForm=document.getElementById("ideaForm");if(ideaForm)ideaForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(ideaForm);await safe(()=>create("ideas",{title:f.get("title"),content:f.get("content"),tags:f.get("tags")}),"保存失败");ideaForm.reset()};const categoryForm=document.getElementById("categoryForm");if(categoryForm)categoryForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(categoryForm);await safe(()=>create("categories",{name:f.get("name"),description:f.get("description"),status:f.get("status")}),"保存失败");categoryForm.reset()};const goalForm=document.getElementById("goalForm");if(goalForm)goalForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(goalForm);await safe(()=>create("team-goals",{period:f.get("period"),title:f.get("title"),dueDate:f.get("dueDate"),objectives:f.get("objectives"),plan:f.get("plan")}),"保存失败");goalForm.reset()};const progressForm=document.getElementById("progressForm");if(progressForm)progressForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(progressForm);await safe(()=>create("team-progress",{goalId:f.get("goalId"),weekStart:f.get("weekStart"),result:f.get("result"),blockers:f.get("blockers"),status:f.get("status")}),"保存失败");progressForm.reset();progressForm.querySelector('[name="weekStart"]').value=state.workspace.weekStart}}
async function refresh(){const data=await api("/api/workspace");state.workspace=data;render()}
async function create(kind,body){await api(`/api/${kind}`,"POST",body);await refresh();toast("已保存")}
async function update(kind,id,body){await api(`/api/${kind}/${id}`,"PUT",body);await refresh();toast("已保存")}
async function remove(kind,id){if(!confirm("确认删除？"))return;await api(`/api/${kind}/${id}`,"DELETE");await refresh();toast("已删除")}
function closeSide(){document.getElementById("side").classList.remove("open");document.getElementById("sideOverlay")?.remove()}
document.getElementById("menuBtn").onclick=()=>{const side=document.getElementById("side");side.classList.add("open");if(!document.getElementById("sideOverlay")){const ov=document.createElement("div");ov.id="sideOverlay";ov.className="side-overlay";ov.onclick=closeSide;document.body.appendChild(ov)}};
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/login","POST",{username:document.getElementById("username").value,password:document.getElementById("password").value});await boot()}catch(err){document.getElementById("loginError").textContent=err.message}};
document.getElementById("logoutBtn").onclick=async()=>await safe(async()=>{await api("/api/logout","POST",{});location.reload()},"退出失败");
document.getElementById("exportBtn").onclick=async()=>await safe(async()=>{const data=await api("/api/export");const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`datu-backup-${state.workspace.today}.json`;a.click();URL.revokeObjectURL(a.href);toast("备份已导出")},"导出失败");
document.getElementById("importFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;await safe(async()=>{const data=JSON.parse(await file.text());await api("/api/import","POST",{data});await refresh();toast("导入成功")},"导入失败");e.target.value=""};
document.getElementById("clearBtn").onclick=async()=>{if(confirm("确认清空当前示例数据？这不会删除账号。"))await safe(async()=>{await api("/api/examples/clear","POST");await refresh();toast("示例已清空")},"清空失败")};
async function boot(){try{const user=await api("/api/me");state.user=user;document.getElementById("userLabel").textContent=user.displayName||user.username;await refresh();showApp()}catch(e){if(e.message!=="登录已过期")console.warn(e)}}
boot();
</script>
</body>
</html>

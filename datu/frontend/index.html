<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f8a8d">
  <title>大土工作台</title>
  <link rel="stylesheet" href="/datu/assets/app.css">
  <link rel="stylesheet" href="/datu/vendor/wang-editor.css">
</head>
<body>
  <div id="app"><div class="splash"><div class="brand-mark">土</div><p>正在加载工作台…</p></div></div>
  <template id="tasks-page-template">
    <section class="route-view">
      <div class="overview-row panel">
        <div class="overview-title"><h2>任务概览</h2><small>实时统计</small></div>
        <div class="overview-stats">
          <div class="metric"><small>总任务</small><strong>{{ workspace.tasks.length }}</strong></div>
          <div class="metric"><small>当前待办</small><strong>{{ currentTasks.length }}</strong></div>
          <div class="metric danger"><small>逾期</small><strong>{{ workspace.tasks.filter(i => i.overdue).length }}</strong></div>
          <div class="metric risk"><small>风险</small><strong>{{ workspace.tasks.filter(i => (i.taskStatus || "pending") === "risk" && !i.done).length }}</strong></div>
          <div class="metric"><small>已完成</small><strong>{{ workspace.tasks.filter(i => i.done).length }}</strong></div>
          <div class="metric"><small>完成率</small><strong>{{ completion }}%</strong></div>
        </div>
      </div>
      <div class="panel today-panel">
        <div class="panel-head"><h2>今日待办</h2><span class="muted">逾期任务自动保留，原始截止日期可追溯</span></div>
        <div class="source-tabs"><button v-for="tab in sourceTabs" :key="tab.key" :class="{ active: source === tab.key }" @click="source = tab.key">{{ tab.label }}</button></div>
        <div class="task-list">
          <div v-for="task in currentTasks" :key="task.id" class="task" :class="{ done: task.done, risk: (task.taskStatus || "pending") === "risk", overdue: task.overdue }">
            <input type="checkbox" :checked="task.done" @change="toggle(task)">
            <div class="task-body">
              <div class="task-title">{{ task.title }}<span class="pill warn source-pill">{{ sourceLabel(task) }}</span></div>
              <div class="task-meta"><span class="pill" :data-priority="task.priority">{{ priorityLabel(task.priority) }}</span><span class="pill risk">{{ taskStatusLabel(task.taskStatus) }}</span><span>截止 {{ formatDate(task.due_date) }}</span><span v-if="task.overdue && task.original_due_date" class="pill red">原始截止 {{ formatDate(task.original_due_date) }}</span><span v-if="task.project_id">{{ projectName(task.project_id) }}</span><span v-if="goalName(task)">{{ goalName(task) }}</span><span v-if="task.postponed_count" class="pill warn">顺延 {{ task.postponed_count }} 次</span></div>
            </div>
            <div class="task-actions"><button class="small" @click="postpone(task)">顺延</button><button class="small danger" @click="remove(task)">删除</button></div>
          </div>
          <p v-if="!currentTasks.length" class="empty">当前维度没有待处理任务</p>
        </div>
      </div>
      <article class="panel">
        <div class="panel-head"><h2>新建任务</h2><span class="muted">输入自动保存草稿</span></div>
        <form class="task-form" @submit.prevent="create">
          <div class="form-row-2">
            <label>任务标题<input v-model.trim="form.title" placeholder="例如：完成巡检报告" required></label>
            <label>截止日期<input v-model="form.dueDate" type="date" required></label>
          </div>
          <div class="form-row-4">
            <label>优先级<select v-model="form.priority"><option value="urgent_important">紧急重要</option><option value="important_not_urgent">重要不紧急</option><option value="urgent_not_important">紧急不重要</option><option value="normal">常规</option></select></label>
            <label>关联项目<select v-model="form.projectId"><option value="">不关联</option><option v-for="project in workspace.projects" :key="project.id" :value="project.id">{{ project.name }}</option></select></label>
            <label>团队目标<select v-model="form.teamGoalId"><option value="">不关联</option><option v-for="goal in workspace.teamGoals" :key="goal.id" :value="goal.id">{{ goal.title }}</option></select></label>
            <label>任务状态<select v-model="form.taskStatus"><option v-for="status in statusOptions" :key="status.key" :value="status.key">{{ status.label }}</option></select></label>
          </div>
          <div class="field-label">任务内容</div>
          <rich-editor v-model="form.content"></rich-editor>
          <button class="btn primary big" type="submit">保存任务</button>
        </form>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>计划任务</h2><span class="muted">最近 10 条</span></div>
        <div class="compact-list">
          <div v-for="task in futureTasks" :key="task.id" class="compact-task"><div class="compact-main"><b>{{ task.title }}</b><span class="pill warn source-pill">{{ sourceLabel(task) }}</span><span class="pill" :data-priority="task.priority">{{ priorityLabel(task.priority) }}</span><span class="pill risk">{{ taskStatusLabel(task.taskStatus) }}</span><small>{{ formatDate(task.due_date) }}</small></div><div class="task-actions"><button class="small danger" @click="remove(task)">删除</button></div></div>
          <p v-if="!futureTasks.length" class="empty">暂无计划任务</p>
        </div>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>已完成</h2><span class="muted">最近 10 条</span></div>
        <div class="compact-list">
          <div v-for="task in doneTasks" :key="task.id" class="compact-task done"><div class="compact-main"><b>{{ task.title }}</b><span class="pill warn source-pill">{{ sourceLabel(task) }}</span><small>{{ formatDate(task.completed_at || task.due_date) }}</small></div><div class="task-actions"><button class="small" @click="toggle(task)">取消完成</button><button class="small danger" @click="remove(task)">删除</button></div></div>
          <p v-if="!doneTasks.length" class="empty">暂无完成记录</p>
        </div>
      </article>
    </section>
  </template>
  <template id="history-page-template">
    <section class="route-view">
      <article class="panel">
        <div class="panel-head"><h2>历史任务</h2><span class="muted">搜索、查看、编辑、删除</span></div>
        <div class="history-search">
          <input v-model.trim="keyword" placeholder="搜索任务标题、内容、项目或团队目标">
          <select v-model="status"><option v-for="option in statusOptions" :key="option.key" :value="option.key">{{ option.label }}</option></select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>任务</th><th>状态</th><th>优先级</th><th>截止</th><th>来源</th><th>操作</th></tr></thead>
            <tbody>
              <tr v-for="task in filteredTasks" :key="task.id">
                <td><b>{{ task.title }}</b><small>{{ projectName(task.project_id) || goalName(task.team_goal_id) || "—" }}</small></td>
                <td><span class="pill" :class="task.taskStatus">{{ taskStatusLabel(task.taskStatus) }}</span></td>
                <td><span class="pill" :data-priority="task.priority">{{ priorityLabel(task.priority) }}</span></td>
                <td>{{ formatDate(task.due_date) }}</td>
                <td>{{ sourceLabel(task) }}</td>
                <td class="table-actions"><button class="small" @click="openDetail(task)">查看详情</button><button class="small" @click="edit(task)">编辑</button><button class="small danger" @click="remove(task)">删除</button></td>
              </tr>
            </tbody>
          </table>
          <p v-if="!filteredTasks.length" class="empty">没有符合条件的任务</p>
        </div>
      </article>
      <div v-if="drawer" class="drawer-mask" @click="closeDrawer"></div>
      <aside v-if="drawer" class="drawer">
        <div class="drawer-head"><h3>{{ drawer.mode === "edit" ? "编辑任务" : "任务详情" }}</h3><button class="link" @click="closeDrawer">关闭</button></div>
        <div class="drawer-body">
          <template v-if="drawer.mode === 'detail'">
            <h2>{{ drawer.task.title }}</h2>
            <div class="task-meta"><span class="pill" :class="drawer.task.taskStatus">{{ taskStatusLabel(drawer.task.taskStatus) }}</span><span class="pill" :data-priority="drawer.task.priority">{{ priorityLabel(drawer.task.priority) }}</span><span>截止 {{ formatDate(drawer.task.due_date) }}</span><span>{{ sourceLabel(drawer.task) }}</span></div>
            <div class="rich-view" v-html="drawer.task.content || '<p class=empty>暂无内容</p>'"></div>
          </template>
          <template v-else>
            <form @submit.prevent="saveEdit">
              <label>任务标题<input v-model.trim="editForm.title" required></label>
              <div class="form-row-2">
                <label>截止日期<input v-model="editForm.dueDate" type="date" required></label>
                <label>任务状态<select v-model="editForm.taskStatus"><option v-for="item in statusOptions.slice(1)" :key="item.key" :value="item.key">{{ item.label }}</option></select></label>
              </div>
              <div class="form-row-2">
                <label>优先级<select v-model="editForm.priority"><option value="urgent_important">紧急重要</option><option value="important_not_urgent">重要不紧急</option><option value="urgent_not_important">紧急不重要</option><option value="normal">常规</option></select></label>
                <label>关联项目<select v-model="editForm.projectId"><option value="">不关联</option><option v-for="project in workspace.projects" :key="project.id" :value="project.id">{{ project.name }}</option></select></label>
              </div>
              <label>团队目标<select v-model="editForm.teamGoalId"><option value="">不关联</option><option v-for="goal in workspace.teamGoals" :key="goal.id" :value="goal.id">{{ goal.title }}</option></select></label>
              <div class="field-label">任务内容</div>
              <rich-editor v-model="editForm.content"></rich-editor>
              <button class="btn primary big" type="submit">保存修改</button>
            </form>
          </template>
        </div>
      </aside>
    </section>
  </template>
  <script src="/datu/vendor/vue.global.prod.js"></script>
  <script src="/datu/vendor/vue-router.global.prod.js"></script>
  <script src="/datu/vendor/wang-editor.global.prod.js"></script>
  <script src="/datu/assets/app.js"></script>
</body>
</html>

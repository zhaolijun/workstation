<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>工作分类详情 · 大土工作台</title>
  <link rel="stylesheet" href="/datu/assets/app.css">
  <link rel="stylesheet" href="https://unpkg.com/@wangeditor/editor@5.1.23/dist/css/style.css">
</head>
<body>
  <div id="app">
    <app-shell :active="'category'" :active-category-id="categoryId" :user="user" :categories="navCategories" v-if="loaded">
      <template #title>{{ category?.name || '工作分类' }}</template>
      <template #content>
        <div class="grid full" v-if="category">
          <div class="card">
            <div class="section-head">
              <h2>分类说明</h2>
              <span>{{ category.done_count }}/{{ category.total_count }} 完成</span>
            </div>
            <p style="margin:0;color:var(--muted);white-space:pre-wrap">{{ category.description || '未填写说明' }}</p>
            <div class="progress" style="margin-top:12px"><i :style="{ width: categoryPercent + '%' }"></i></div>
          </div>

          <div class="grid two">
            <div class="card">
              <h2>新建任务目标</h2>
              <div class="form-grid">
                <div class="field"><label>目标名称</label><input v-model.trim="goalForm.title" placeholder="例如：Q3 可用性提升"></div>
                <div class="field"><label>目标日期</label><input v-model="goalForm.dueDate" type="date"></div>
                <div class="field"><label>状态</label>
                  <select v-model="goalForm.status">
                    <option value="not_started">未开始</option>
                    <option value="in_progress">进行中</option>
                    <option value="completed">已完成</option>
                    <option value="blocked">卡住</option>
                  </select>
                </div>
                <div class="field full"><label>目标说明</label><rich-editor v-model="goalForm.content"></rich-editor></div>
              </div>
              <div class="form-actions"><button class="btn primary" @click="createGoal">保存目标</button></div>
            </div>

            <div class="card">
              <h2>添加子任务</h2>
              <div class="form-grid">
                <div class="field"><label>目标</label>
                  <select v-model="selectedGoalId">
                    <option v-for="goal in goals" :key="goal.id" :value="goal.id">{{ goal.title }}</option>
                  </select>
                </div>
                <div class="field"><label>子任务标题</label><input v-model.trim="subtaskForm.title" placeholder="要做什么？"></div>
                <div class="field"><label>截止日期</label><input v-model="subtaskForm.dueDate" type="date"></div>
                <div class="field"><label>轻重缓急</label>
                  <select v-model="subtaskForm.priority">
                    <option v-for="(text, key) in priorityText" :key="key" :value="key">{{ text }}</option>
                  </select>
                </div>
                <div class="field full"><label>子任务内容</label><rich-editor v-model="subtaskForm.content"></rich-editor></div>
              </div>
              <div class="form-actions"><button class="btn primary" @click="createSubtask">添加子任务</button></div>
            </div>
          </div>

          <div class="card">
            <div class="section-head"><h2>任务目标</h2><span>{{ goals.length }} 个</span></div>
            <div class="list">
              <article v-for="goal in goals" :key="goal.id" class="item">
                <div class="item-top">
                  <div>
                    <div class="item-title">{{ goal.title }}</div>
                    <div class="meta">
                      <span class="tag blue">{{ statusText[goal.status] || goal.status }}</span>
                      <span v-if="goal.due_date">目标日期 {{ formatDate(goal.due_date) }}</span>
                      <span>{{ goal.done_count }}/{{ goal.total_count }} 子任务</span>
                    </div>
                    <div class="progress" style="margin-top:10px"><i :style="{ width: goalPercent(goal) + '%' }"></i></div>
                    <div v-if="goal.content" class="content-preview" v-html="goal.content"></div>
                  </div>
                  <button class="btn small danger" @click="removeGoal(goal)">删除</button>
                </div>
                <div class="list" style="margin-top:12px">
                  <article v-for="task in goalTasks(goal.id)" :key="task.id" class="item">
                    <div class="item-top">
                      <input class="check" type="checkbox" :checked="task.done" @change="toggleTask(task)">
                      <div>
                        <div class="item-title">{{ task.title }}</div>
                        <div class="meta">
                          <span class="tag" :style="{ background: priorityColor[task.priority] + '22', color: priorityColor[task.priority] }">{{ priorityText[task.priority] }}</span>
                          <span class="tag">截止 {{ formatDate(task.due_date) }}</span>
                        </div>
                        <div v-if="task.content" class="content-preview" v-html="task.content"></div>
                      </div>
                    </div>
                    <div class="item-actions">
                      <button class="btn small" @click="postponeTask(task)">顺延明天</button>
                      <button class="btn small danger" @click="removeTask(task)">删除</button>
                    </div>
                  </article>
                </div>
                <div v-if="!goalTasks(goal.id).length" class="empty">暂无子任务</div>
              </article>
            </div>
            <div v-if="!goals.length" class="empty">暂无任务目标</div>
          </div>
        </div>
        <div v-else class="card"><div class="empty">分类不存在或已删除</div></div>
      </template>
    </app-shell>
  </div>
  <script src="/datu/vendor/vue.global.prod.js"></script>
  <script src="https://unpkg.com/@wangeditor/editor@5.1.23/dist/index.js"></script>
  <script src="/datu/assets/app.js"></script>
  <script>
    Datu.mountPage({
      active: "category",
      setup() {
        const categoryId = Number(new URLSearchParams(location.search).get("id"));
        const state = Vue.reactive({
          categories: [], goals: [], tasks: [],
          selectedGoalId: "",
          goalForm: { title: "", content: "", dueDate: "", status: "in_progress" },
          subtaskForm: { title: "", content: "", dueDate: Datu.today(), priority: "urgent_important" }
        });

        const category = Vue.computed(() => state.categories.find(item => item.id === categoryId));
        const goals = Vue.computed(() => state.goals.filter(goal => goal.category_id === categoryId));
        const categoryPercent = Vue.computed(() => {
          const current = category.value;
          return current && current.total_count ? Math.round(current.done_count * 100 / current.total_count) : 0;
        });

        async function load() {
          const workspace = await Datu.request("/datu/api/workspace");
          state.categories = workspace.categories || [];
          state.goals = workspace.goals || [];
          state.tasks = workspace.tasks || [];
          if (!state.selectedGoalId && goals.value.length) state.selectedGoalId = goals.value[0].id;
        }

        async function refresh() { await load(); Datu.showToast("已保存"); }
        async function createGoal() {
          if (!state.goalForm.title) return;
          await Datu.request("/datu/api/goals", "POST", { ...state.goalForm, categoryId });
          state.goalForm = { title: "", content: "", dueDate: "", status: "in_progress" };
          await refresh();
        }
        async function createSubtask() {
          if (!state.selectedGoalId || !state.subtaskForm.title) return;
          await Datu.request("/datu/api/tasks", "POST", { ...state.subtaskForm, categoryId, goalId: state.selectedGoalId });
          state.subtaskForm = { title: "", content: "", dueDate: Datu.today(), priority: "urgent_important" };
          await refresh();
        }
        async function removeGoal(goal) { if (!confirm("确认删除目标？")) return; await Datu.request(`/datu/api/goals/${goal.id}`, "DELETE"); await refresh(); }
        async function toggleTask(task) { await Datu.request(`/datu/api/tasks/${task.id}`, "PUT", { done: !task.done }); await refresh(); }
        async function postponeTask(task) { await Datu.request(`/datu/api/tasks/${task.id}`, "PUT", { postpone: true, postponedCount: task.postponed_count }); await refresh(); }
        async function removeTask(task) { if (!confirm("确认删除？")) return; await Datu.request(`/datu/api/tasks/${task.id}`, "DELETE"); await refresh(); }
        function goalTasks(goalId) { return state.tasks.filter(task => task.goal_id === goalId); }
        function goalPercent(goal) { return goal.total_count ? Math.round(goal.done_count * 100 / goal.total_count) : 0; }

        Vue.onMounted(load);
        return {
          ...Vue.toRefs(state), category, goals, categoryPercent,
          createGoal, createSubtask, removeGoal, toggleTask, postponeTask, removeTask,
          goalTasks, goalPercent,
          priorityText: Datu.priorityText, priorityColor: Datu.priorityColor, statusText: Datu.statusText, formatDate: Datu.formatDate
        };
      }
    });
  </script>
</body>
</html>

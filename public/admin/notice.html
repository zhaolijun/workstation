<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日提醒 · 沐沐学习乐园后台</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<script src="/admin/assets/admin.js"></script>
<script>
(async function(){
  const $root=await admin.mountLayout('notice','每日提醒');
  const {esc,today,ok,err,confirm2}=admin;
  let D=await admin.api.all();
  let editKey=null;

  $root.innerHTML=`
    <div class="card">
      <div class="card-h">📣 新增 / 编辑提醒</div>
      <div class="f-row">
        <div class="f-item iw120"><label>日期</label><input type="date" class="input" id="nDate"></div>
        <div class="f-item"><label>提醒内容（300 字内）</label>
          <textarea class="input" id="nTxt" rows="3" maxlength="300"></textarea>
          <div style="font-size:11px;color:var(--sub);text-align:right" id="nCnt">0/300</div>
        </div>
      </div>
      <div class="row">
        <label style="font-size:13px;font-weight:600"><input type="checkbox" id="nShow" checked> 启用（首页展示）</label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-pri" id="btnSave" onclick="saveNote()">➕ 添加提醒</button>
        <button class="btn btn-ghost" id="btnCancel" style="display:none" onclick="cancelEdit()">取消编辑</button>
      </div>
    </div>

    <div class="card">
      <div class="card-h">📋 提醒列表 <small>勾选「启用」才会出现在首页</small></div>
      <div id="list"></div>
    </div>
  `;

  document.getElementById('nTxt').addEventListener('input',function(){
    document.getElementById('nCnt').textContent=this.value.length+'/300';
  });

  function render(){
    const keys=Object.keys(D.dailyNotes||{}).sort().reverse();
    document.getElementById('list').innerHTML=keys.length?`<table class="tbl">
      <tr><th style="width:100px">日期</th><th>提醒内容</th><th class="center" style="width:80px">启用</th><th style="width:160px">操作</th></tr>${
        keys.map(k=>{
          const n=D.dailyNotes[k];
          return `<tr>
            <td>${esc(k)}</td>
            <td style="white-space:pre-wrap;word-break:break-all">${esc(n.text)}</td>
            <td class="center">
              <label style="cursor:pointer">
                <input type="checkbox" ${n.show?'checked':''} onchange="toggleShow('${k}',this.checked)">
              </label>
            </td>
            <td>
              <button class="btn btn-ghost btn-sm" onclick="editNote('${k}')">编辑</button>
              <button class="btn btn-red btn-sm" onclick="delNote('${k}')">删除</button>
            </td>
          </tr>`;
        }).join('')
      }</table>`:'<div class="empty">暂无提醒</div>';
  }
  function cancelEdit(){
    editKey=null;
    document.getElementById('nTxt').value='';
    document.getElementById('nDate').value=today();
    document.getElementById('nShow').checked=true;
    document.getElementById('nCnt').textContent='0/300';
    document.getElementById('btnSave').textContent='➕ 添加提醒';
    document.getElementById('btnCancel').style.display='none';
  }
  window.cancelEdit=cancelEdit;
  window.saveNote=function(){
    const d=document.getElementById('nDate').value||today();
    const txt=document.getElementById('nTxt').value.trim();
    const show=document.getElementById('nShow').checked;
    if(!txt){ err('请填写提醒内容'); return; }
    if(!D.dailyNotes) D.dailyNotes={};
    if(editKey && editKey!==d){ delete D.dailyNotes[editKey]; }
    D.dailyNotes[d]={text:txt.slice(0,300),show};
    admin.api.set('dailyNotes',D.dailyNotes).then(()=>{ok('已保存'); cancelEdit(); render();});
  };
  window.editNote=function(k){
    const n=D.dailyNotes[k]; if(!n) return;
    editKey=k;
    document.getElementById('nDate').value=k;
    document.getElementById('nTxt').value=n.text;
    document.getElementById('nShow').checked=!!n.show;
    document.getElementById('nCnt').textContent=n.text.length+'/300';
    document.getElementById('btnSave').textContent='💾 保存修改';
    document.getElementById('btnCancel').style.display='';
    window.scrollTo(0,0);
  };
  window.delNote=function(k){
    if(!confirm2('确定删除 '+k+' 的提醒？')) return;
    delete D.dailyNotes[k];
    admin.api.set('dailyNotes',D.dailyNotes).then(()=>{ok('已删除'); render();});
  };
  window.toggleShow=function(k,v){
    if(!D.dailyNotes[k]) return;
    D.dailyNotes[k].show=v;
    admin.api.set('dailyNotes',D.dailyNotes).then(()=>{ok(v?'已启用':'已停用');});
  };
  document.getElementById('nDate').value=today();
  render();
})();
</script>
</body>
</html>
